<style>
    .hc-wall-admin .panel-heading { padding-bottom: 0; }
    .hc-wall-admin .nav-tabs { border-bottom: 0; margin-top: 8px; }
    .hc-wall-admin .nav-tabs > li > a { padding: 8px 14px; }
    .hc-wall-admin .toolbar { padding: 8px; }
    .hc-wall-admin .toolbar .btn { margin-right: 6px; }
    .hc-wall-admin .table td { vertical-align: middle !important; }
    .hc-wall-metrics { color: #555; white-space: nowrap; }
    .hc-wall-metrics .muted { color: #999; margin-left: 8px; }
    .hc-wall-metrics .muted:first-child { margin-left: 0; }
</style>
<div class="panel panel-default panel-intro hc-wall-admin">
    <div class="panel-heading">
        {:build_heading(null,FALSE)}
        <ul class="nav nav-tabs" data-field="is_featured">
            <li class="{:$Think.get.is_featured === null ? 'active' : ''}"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
            {foreach name="isFeaturedList" item="vo"}
            <li class="{:$Think.get.is_featured === (string)$key ? 'active' : ''}"><a href="#t-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
            {/foreach}
        </ul>
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
                </div>
            </div>
        </div>
    </div>
</div>
