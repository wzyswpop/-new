<link rel="stylesheet" href="__CDN__/assets/libs/element/libs/element/element.css">
<link rel="stylesheet" href="__CDN__/assets/libs/element/libs/common.css">
<script src="__CDN__/assets/libs/element/libs/vue.js"></script>
<script src="__CDN__/assets/libs/element/libs/element/element.js"></script>
<script src="__CDN__/assets/libs/element/libs/moment.js"></script>
<style>
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
    }

    input[type="number"] {
        -moz-appearance: textfield; /* 此处写不写都可以 */
    }
    .inputs{
        width: 37.5%
    }
    [v-cloak]{
        display: none !important;
    }
</style>
<div id="app" style="width: 80%;margin: auto" v-cloak>
    <el-form ref="form" :model="form_data" label-width="82px" :rules="rules" >
        <el-form-item label="名称:" prop="name">
            <el-input v-model="form_data.name" class="inputs"></el-input>
        </el-form-item>
        <el-form-item label="商品:" prop="goods_type">
            <el-select v-model="form_data.goods_type" placeholder="适用商品" class="inputs" @change="changeGoodsType">
                <el-option :label="item.label" :value="item.value" v-for="(item,index) in goods_type" ></el-option>
            </el-select>
        </el-form-item>
        <el-form-item v-if="form_data.goods_type == 2">
            <div style="margin-bottom: 5px">
                <el-button type="success" size="small" @click="changeGoods">选择商品</el-button>
            </div>
            <el-table :data="goods_list" style="width: 100%">
                <el-table-column prop="name" label="名称" width="180"></el-table-column>
                <el-table-column label="封面">
                    <template slot-scope="scope">
                        <el-image style="width: 30px; height: 30px" :src="scope.row.image" fit="cover"></el-image>
                    </template>
                </el-table-column>
                <el-table-column prop="money" label="价格" width="180"></el-table-column>
                <el-table-column label="操作">
                    <template slot-scope="scope">
                        <a href="javascript:;" @click="removeGoods(scope.row.id)">移除</a>
                    </template>
                </el-table-column>
            </el-table>
        </el-form-item>
        <el-form-item label="面额:" prop="amount">
            <el-input v-model="form_data.amount" type="number" class="inputs"></el-input>
        </el-form-item>
        <el-form-item label="订单满:" prop="use_money">
            <el-input v-model="form_data.use_money" type="number" class="inputs">
                <template slot="append">元可使用</template>
            </el-input>
        </el-form-item>
        <el-form-item label="库存:" prop="stock">
            <el-input v-model="form_data.stock" type="number" class="inputs"></el-input>
        </el-form-item>
        <el-form-item label="领取:" prop="day">
            <el-input v-model="form_data.day" type="number" class="inputs">
                <template slot="append">天后到期</template>
            </el-input>
        </el-form-item>
        <el-form-item label="到期时间:" prop="endtime">
            <el-col :span="9">
                <el-date-picker type="datetime" value-format="yyyy-MM-dd HH:mm:ss" placeholder="选择日期" v-model="form_data.endtime" style="width: 100%;"></el-date-picker>
            </el-col>
        </el-form-item>
        <el-form-item label="状态:">
            <el-radio-group v-model="form_data.status">
                <el-radio :label="item.value"  v-for="(item,index) in status_list">{{item.label}}</el-radio>
            </el-radio-group>
        </el-form-item>
        <el-form-item>
            <el-button type="primary" @click="onSubmit">提交</el-button>
        </el-form-item>
    </el-form>
</div>
