<div class="panel panel-default panel-intro ops-page ops-taxonomy-page">
    
    <div class="panel-heading">
        {:build_heading(null,FALSE)}
        <ul class="nav nav-tabs" data-field="status">
            <li class="{:$Think.get.status === null ? 'active' : ''}"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
            {foreach name="statusList" item="vo"}
            <li class="{:$Think.get.status === (string)$key ? 'active' : ''}"><a href="#t-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
            {/foreach}
        </ul>
    </div>


    <div class="panel-body ops-body">
        <div class="ops-shell">
            <div class="ops-header">
                <div>
                    <div class="ops-kicker">商品模块</div>
                    <h1 class="ops-title">标签与分类</h1>
                    <p class="ops-subtitle">维护咖啡豆产国、风味标签和前端搭配筛选项，让商品资料更好检索。</p>
                </div>
                <div class="ops-actions">
                    <a href="javascript:;" class="btn btn-primary btn-add {:$auth->check('yp/goods_category/add')?'':'hide'}" title="{:__('Add')}" ><i class="fa fa-plus"></i> 新增标签</a>
                </div>
            </div>
            <div class="ops-card">
                <div class="ops-card-toolbar">
                    <div id="toolbar" class="toolbar ops-toolbar">
                        <a href="javascript:;" class="btn btn-default btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> 刷新</a>
                        <a href="javascript:;" class="btn btn-default btn-edit btn-disabled disabled {:$auth->check('yp/goods_category/edit')?'':'hide'}" title="{:__('Edit')}" ><i class="fa fa-pencil"></i> 编辑</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('yp/goods_category/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> 删除</a>
                    </div>
                </div>
                <div id="myTabContent" class="tab-content ops-table-wrap">
                    <div class="tab-pane fade active in" id="one">
                        <div class="widget-body no-padding">
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('yp/goods_category/edit')}"
                           data-operate-del="{:$auth->check('yp/goods_category/del')}"
                           width="100%">
                    </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
