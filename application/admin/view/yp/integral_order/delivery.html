<style type="text/css">
    #c-express_name{
        width: 300px;
        display: block;
    }
    .control-label span{
        font-weight: normal;
        color: #777;
    }
</style>
<form id="edit-form" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label for="shopname" class="control-label">快递公司:</label>
        <select id="c-express_name" name="express_code" class="form-control" data-rule="required">
            <option value="">请选择快递公司</option>
            {volist name="kuaidi" id="vo"}
            <option value="{$vo.code}">{$vo.name}</option>
            {/volist}
        </select>
    </div>

    <div class="form-group">
        <label for="shopname" class="control-label">快递单:</label>
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>订单号</th>
                <th>状态</th>
                <th>姓名</th>
                <th>手机</th>
                <th>地区</th>
                <th>快递单号</th>
            </tr>
            </thead>
            <tbody>
            {if condition="$lists"}
            {volist name="lists" id="order"}
            <tr>
                <!--                <th style="text-align: center; vertical-align: middle;" scope="row">{$order.id}</th>-->
                <td style="text-align: center; vertical-align: middle;">{$order.order_no}</td>
                <td style="vertical-align: middle;"><span class="text-blue">{$order.status_text}</span></td>
                <td style="text-align: center; vertical-align: middle;">{$order.name}</td>
                <td style="text-align: center; vertical-align: middle;">{$order.phone}</td>
                <td style="vertical-align: middle;">{$order.province_name}{$order.city_name}{$order.county_name}{$order.address}</td>
                <td style="text-align: center; vertical-align: middle;">
                    <input type="hidden" name="order[id][]" value="{$order.id}">
                    <input id="c-express_no" data-rule="required" class="form-control" name="order[express_no][]" type="text" value="">
                </td>
            </tr>
            {/volist}
            {else}
            <tr>
                <td style="text-align: center" colspan="7">
                    暂无可发货订单
                </td>
            </tr>
            {/if}
            </tbody>
        </table>
    </div>

    <!-- <div class="form-group">
        <label for="shopname" class="control-label">设置订单: <span>（开启后将所选订单设置为发货）</span></label>
        <p>{:Form::switcher('row[setorder]', '0', ['color'=>'info'])}</p>
    </div> -->

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-1"></label>
        <div class="col-xs-12 col-sm-10">
            {if condition="$lists"}
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            {else}
            <button type="reset" class="btn btn-primary btn-embossed btn-close" onclick="Layer.closeAll();">{:__('Close')}</button>
            {/if}
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
