<style>
    .hc-wall-admin .panel-heading { padding-bottom: 0; }
    .hc-wall-admin .nav-tabs { border-bottom: 0; margin-top: 8px; }
    .hc-wall-admin .nav-tabs > li > a { padding: 8px 14px; }
    .hc-wall-admin .toolbar { padding: 8px; }
    .hc-wall-admin .toolbar .btn { margin-right: 6px; }
    .hc-wall-admin .table td { vertical-align: middle !important; }
    .hc-wall-source { color: #777; white-space: nowrap; }
</style>
<div class="panel panel-default panel-intro hc-wall-admin">
    <div class="panel-heading">
        {:build_heading(null,FALSE)}
        <ul class="nav nav-tabs" data-field="status">
            <li class="{:$Think.get.status === null ? 'active' : ''}"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
            {foreach name="statusList" item="vo"}
            <li class="{:$Think.get.status === (string)$key ? 'active' : ''}"><a href="#t-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
            {/foreach}
        </ul>
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
                        <a class="btn btn-success btn-multi btn-disabled disabled {:$auth->check('yp/recipe_comment/multi')?'':'hide'}" href="javascript:;" data-params="status=normal"><i class="fa fa-eye"></i> 显示</a>
                        <a class="btn btn-default btn-multi btn-disabled disabled {:$auth->check('yp/recipe_comment/multi')?'':'hide'}" href="javascript:;" data-params="status=hidden"><i class="fa fa-eye-slash"></i> 隐藏</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
                </div>
            </div>
        </div>
    </div>
</div>
