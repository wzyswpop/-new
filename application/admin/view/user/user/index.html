<div class="panel panel-default panel-intro ops-page ops-user-page">
    {:build_heading()}

    <div class="panel-body ops-body">
        <div class="ops-shell">
            <div class="ops-header">
                <div>
                    <div class="ops-kicker">会员运营</div>
                    <h1 class="ops-title">用户管理</h1>
                    <p class="ops-subtitle">查看会员资料、积分、推荐关系和推荐佣金比例。</p>
                </div>
                <div class="ops-actions">
                    <a href="javascript:;" class="btn btn-primary btn-edit btn-disabled disabled {:$auth->check('user/user/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> 编辑用户</a>
                </div>
            </div>

            <div class="ops-card">
                <div class="ops-card-toolbar">
                    <div id="toolbar" class="toolbar ops-toolbar">
                        <a href="javascript:;" class="btn btn-default btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i> 刷新</a>
                        <a href="javascript:;" class="btn btn-default btn-edit btn-disabled disabled {:$auth->check('user/user/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> 编辑</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('user/user/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> 删除</a>
                    </div>
                </div>
                <div id="myTabContent" class="tab-content ops-table-wrap">
                    <div class="tab-pane fade active in" id="one">
                        <div class="widget-body no-padding">
                            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                                   data-operate-edit="{:$auth->check('user/user/edit')}"
                                   data-operate-del="{:$auth->check('user/user/del')}"
                                   width="100%">
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
