<style>
    .hc-share-poster-page {
        padding: 32px;
        background: #f6f7f9;
        min-height: calc(100vh - 70px);
    }
    .hc-share-poster-card {
        max-width: 980px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e8eaef;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, .06);
        overflow: hidden;
    }
    .hc-share-poster-header {
        padding: 28px 32px 22px;
        border-bottom: 1px solid #eef0f4;
    }
    .hc-share-poster-header h3 {
        margin: 0;
        color: #1d1d1f;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.35;
    }
    .hc-share-poster-header p {
        margin: 10px 0 0;
        color: #86868b;
        font-size: 14px;
        line-height: 1.7;
    }
    .hc-share-poster-body {
        padding: 30px 32px 34px;
    }
    .hc-share-poster-preview {
        width: 168px;
        min-height: 220px;
        border-radius: 18px;
        border: 1px solid #e5e7eb;
        background: #f5f5f7;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 13px;
    }
    .hc-share-poster-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .hc-share-poster-form .form-group {
        margin-bottom: 24px;
    }
    .hc-share-poster-form .control-label {
        color: #1f2937;
        font-weight: 600;
        padding-top: 9px;
    }
    .hc-share-poster-form .form-control {
        height: 42px;
        border-radius: 10px;
        border-color: #dfe3ea;
        box-shadow: none;
        font-size: 14px;
    }
    .hc-share-poster-form .help-block {
        color: #8a8f98;
        margin-top: 8px;
        line-height: 1.6;
    }
    .hc-share-poster-actions {
        padding-top: 8px;
    }
    .hc-share-poster-actions .btn {
        min-width: 118px;
        height: 42px;
        border-radius: 999px;
        font-weight: 600;
    }
</style>

<div class="hc-share-poster-page">
    <div class="hc-share-poster-card">
        <div class="hc-share-poster-header">
            <h3>分享海报图</h3>
            <p>用于小程序「我的 - 分享夯萃小程序」页面的分享海报展示。建议上传竖版图片，保持文字清晰、主体居中。</p>
        </div>

        <div class="hc-share-poster-body">
            <form id="share-poster-form" class="form-horizontal hc-share-poster-form" role="form" data-toggle="validator" method="POST" action="">
                {:token()}

                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">当前预览</label>
                    <div class="col-xs-12 col-sm-8">
                        <div class="hc-share-poster-preview" id="share-poster-preview">
                            {if condition="$shareImage"}
                            <img src="{:cdnurl($shareImage, true)}" alt="分享海报图">
                            {else /}
                            暂无海报图
                            {/if}
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">海报图片</label>
                    <div class="col-xs-12 col-sm-8">
                        <div class="input-group">
                            <input id="c-share_image" data-rule="required" class="form-control" size="50" name="row[share_image]" type="text" value="{$shareImage|htmlentities}">
                            <div class="input-group-addon no-border no-padding">
                                <span><button type="button" id="faupload-share_image" class="btn btn-danger faupload" data-input-id="c-share_image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-share_image"><i class="fa fa-upload"></i> 上传</button></span>
                                <span><button type="button" id="fachoose-share_image" class="btn btn-primary fachoose" data-input-id="c-share_image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> 选择</button></span>
                            </div>
                            <span class="msg-box n-right" for="c-share_image"></span>
                        </div>
                        <ul class="row list-inline faupload-preview" id="p-share_image"></ul>
                        <p class="help-block">上传成功后点击下方「保存设置」，小程序端会读取新的分享海报图。</p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">分享标题</label>
                    <div class="col-xs-12 col-sm-8">
                        <input id="c-share_title" class="form-control" name="row[share_title]" type="text" value="{$shareTitle|htmlentities}" placeholder="例如：小批量配方定制，告别价格战">
                        <p class="help-block">用于分享时的辅助文案，可留空。</p>
                    </div>
                </div>

                <div class="form-group hc-share-poster-actions">
                    <label class="control-label col-xs-12 col-sm-2"></label>
                    <div class="col-xs-12 col-sm-8">
                        <button type="submit" class="btn btn-primary btn-embossed disabled">保存设置</button>
                        <button type="reset" class="btn btn-default btn-embossed">重置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
